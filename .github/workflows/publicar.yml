name: Publicar versión

# Cómo publicar una actualización:
#   GitHub > pestaña "Actions" > "Publicar versión" > "Run workflow"
#   Escribe el número de versión (por ejemplo 1.0.1) y qué cambia.
# Al terminar (unos 4 minutos) los programas instalados en la tienda lo detectan
# y se actualizan solos.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Número de versión nueva (ej. 1.0.1). Debe ser mayor que la anterior."
        required: true
      notas:
        description: "Qué cambia en esta versión"
        required: false
        default: "Mejoras y correcciones."
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fijar número de versión
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME}"; fi
          V="${V#v}"; V="${V#V}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          sed -i "s/^VERSION = .*/VERSION = \"$V\"/" app/version.py
          cat app/version.py

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Comprobar que el programa arranca
        run: python -c "import app.interfaz, app.lector, app.informe, app.correo, app.actualizador; print('ok')"

      - name: Probar el sistema de actualización (Windows)
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "prueba actualización ñ"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Set-Content -Path "$tmp\viejo.exe" -Value "viejo"
          Set-Content -Path "$tmp\nuevo.exe" -Value "nuevo"
          $p = Start-Process python -ArgumentList '-c "import time; time.sleep(4)"' -PassThru
          python -c "import sys; from pathlib import Path; from app.actualizador import lanzar_sustitucion; t=Path(sys.argv[1]); lanzar_sustitucion(int(sys.argv[2]), t/'nuevo.exe', t/'viejo.exe', arrancar=False).wait()" "$tmp" $p.Id
          $c = Get-Content "$tmp\viejo.exe"
          if ($c -ne "nuevo") { throw "La actualización no sustituyó el ejecutable" }
          $env:_PYI_APPLICATION_HOME_DIR = "C:\falso"; $env:_MEIPASS2 = "C:\falso"
          python -c "from app.actualizador import entorno_limpio as e; d=e(); assert not any(k.upper().startswith(('_PYI','_MEI')) for k in d), d; assert d['PYINSTALLER_RESET_ENVIRONMENT']=='1'"
          Write-Host "Actualización OK"

      - name: Crear FacturasLH.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name FacturasLH
          --icon assets/logo.ico
          --add-data "assets;assets"
          --collect-all pypdfium2
          --collect-all pypdfium2_raw
          --hidden-import keyring.backends.Windows
          main.py

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Facturas LH ${{ env.VERSION }}
          body: ${{ inputs.notas || 'Mejoras y correcciones.' }}
          files: dist/FacturasLH.exe
          make_latest: true
